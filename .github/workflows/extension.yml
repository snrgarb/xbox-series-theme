# The extension's pipeline: Core, the extension and their tests, plus the Dashboard theme the .pext embeds.
#   check   on a PR or a push to main that touches the extension's paths: runs the Core tests, builds the extension.
#   deploy  on a manual run alone: builds the Release .pext and creates the GitHub Release extension-v<Bundle version>.
name: Extension

on:
  pull_request:
    paths:
      - 'extension/**'
      - 'theme/**'
      - 'shared/**'
      - 'build/**'
      - 'Directory.Build.props'
      - 'XboxSeries.slnx'
      - '.github/workflows/extension.yml'
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - 'theme/**'
      - 'shared/**'
      - 'build/**'
      - 'Directory.Build.props'
      - 'XboxSeries.slnx'
      - '.github/workflows/extension.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  check:
    if: github.event_name != 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # A failing Core test fails the job.
      - name: Core tests
        run: dotnet test extension/XboxSeries.Core.Tests/XboxSeries.Core.Tests.csproj --configuration Debug

      # Both configurations compile: Debug is the one installed for testing, Release the one released.
      # Each also packs the .pext, which fails if Playnite.SDK.dll or Newtonsoft.Json.dll would ship.
      - name: Build the extension, Debug
        run: dotnet build extension/XboxSeries.Extension/XboxSeries.Extension.csproj --configuration Debug

      - name: Build the extension, Release
        run: dotnet build extension/XboxSeries.Extension/XboxSeries.Extension.csproj --configuration Release

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read the Bundle version
        id: version
        shell: pwsh
        run: |
          $version = (dotnet msbuild extension/XboxSeries.Extension/XboxSeries.Extension.csproj -getProperty:Version -p:Configuration=Release).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw "Could not read the Bundle version: '$version'" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=extension-v$version" >> $env:GITHUB_OUTPUT
          "Bundle version $version, tag extension-v$version"

      # Never overwrite: a second run at the same version stops here.
      - name: Refuse if the release already exists
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          # Only gh's "release not found" means there's none: any other failure (auth, rate limit, network) stops here.
          $release = gh release view $tag 2>&1
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists; bump <Version> in Directory.Build.props." }
          if ("$release" -notmatch 'release not found') { throw "Couldn't check for release ${tag}: $release" }
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "git ls-remote failed" }
          if ($remoteTag) { throw "Tag $tag already exists." }
          $global:LASTEXITCODE = 0

      - name: Core tests
        run: dotnet test extension/XboxSeries.Core.Tests/XboxSeries.Core.Tests.csproj --configuration Release

      # Packs artifacts/Release/XboxSeries_<Version>.pext with the Release .pthm inside.
      - name: Build the Release .pext
        run: dotnet build extension/XboxSeries.Extension/XboxSeries.Extension.csproj --configuration Release

      # The build already refuses to pack Playnite.SDK.dll or Newtonsoft.Json.dll; this checks the zip itself as well,
      # and that the .pthm is in it and the extension has no Debug-only pane or Guide hotkey.
      - name: Check the .pext
        id: pext
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $pext = "artifacts/Release/XboxSeries_$version.pext"
          if (-not (Test-Path $pext)) { throw "$pext was not built" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $pext))
          try {
            $names = $zip.Entries | ForEach-Object { ($_.FullName -split '[\/]')[-1] }
            foreach ($banned in 'Playnite.SDK.dll', 'Newtonsoft.Json.dll') {
              if ($names -contains $banned) { throw "$banned must not ship in the .pext" }
            }
            if ($names -notcontains "XboxSeries_Dashboard_$version.pthm") { throw "The .pext has no XboxSeries_Dashboard_$version.pthm" }
            # Debug-only code (the pane, the Guide hotkey, the pad's keyboard keys, the ring and notices) leaves these
            # names in a Debug DLL's metadata and none in a Release one.
            foreach ($assembly in 'XboxSeries.Extension.dll', 'XboxSeries.Core.dll') {
              $dll = $zip.Entries | Where-Object { $_.Name -eq $assembly }
              if (-not $dll) { throw "The .pext has no $assembly" }
              $stream = $dll.Open(); $buffer = New-Object IO.MemoryStream; $stream.CopyTo($buffer); $stream.Dispose()
              $text = [Text.Encoding]::UTF8.GetString($buffer.ToArray())
              foreach ($debugOnly in 'DebugPane', 'DebugGuideHotkey', 'DebugButtonFor', 'DebugRing', 'DebugNotify') {
                if ($text.Contains($debugOnly)) { throw "$assembly holds the Debug-only ${debugOnly}: not a Release build" }
              }
            }
          } finally { $zip.Dispose() }
          "path=$pext" >> $env:GITHUB_OUTPUT
          $names

      - name: Create the GitHub Release
        shell: pwsh
        run: |
          gh release create '${{ steps.version.outputs.tag }}' '${{ steps.pext.outputs.path }}' `
            --target '${{ github.sha }}' `
            --title 'Extension ${{ steps.version.outputs.version }}' `
            --notes 'XboxSeries extension ${{ steps.version.outputs.version }}, built in Release with the matching Dashboard theme inside.'
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
