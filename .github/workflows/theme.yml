# The Dashboard theme's pipeline (#129).
#   check   every PR or push to main that touches what the theme packs: packs the .pthm in Debug and Release
#           and fails if the package is missing or its manifest isn't stamped with the Bundle version.
#   deploy  manual runs only: packs the Release .pthm and creates the GitHub Release theme-v<Version>
#           with it attached. Refuses if that tag or release already exists; never overwrites. Refuses too if
#           VirusTotal flags the .pthm (build/VirusTotal.ps1).
# The theme project imports only Directory.Build.props (for Version) and packs shared/Images; it doesn't use build/.
name: Theme

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - theme/**
      - shared/Images/**
      - Directory.Build.props
      - .github/workflows/theme.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  THEME_PROJECT: theme/XboxSeries.Dashboard/XboxSeries.Dashboard.proj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Every PR runs this workflow, so its check can be required on main (docs/development.md): this job reads the PR's
  # files, and the check below runs only when one is under the paths that push lists. Skipped, the check reports
  # success. Any other event, or a PR whose files can't be listed, runs the check.
  changes:
    name: 'Theme: changes'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - name: Did the PR touch this component?
        id: paths
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PATHS: '^(theme/|shared/Images/|Directory\.Build\.props$|\.github/workflows/theme\.yml$)'
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! files="$(gh pr diff "$PR" --name-only --repo "$GITHUB_REPOSITORY")"; then
            echo "Couldn't list the PR's files: running the check"; echo run=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -qE "$PATHS" <<< "$files"; then echo run=true; else echo run=false; fi | tee -a "$GITHUB_OUTPUT"

  check:
    name: 'Theme: pack and verify'
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack and verify the theme (Debug and Release)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $version = (dotnet msbuild $env:THEME_PROJECT -getProperty:Version).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected Bundle version '$version'" }
          Write-Host "Bundle version: $version"

          foreach ($config in 'Debug', 'Release') {
            dotnet build $env:THEME_PROJECT -c $config
            $pthm = (dotnet msbuild $env:THEME_PROJECT -p:Configuration=$config -getProperty:ThemePackagePath).Trim()
            $expectedName = "XboxSeries_Dashboard_$version.pthm"
            if ((Split-Path $pthm -Leaf) -ne $expectedName) { throw "$config package is '$pthm', expected $expectedName" }
            if (-not (Test-Path $pthm)) { throw "$config pack did not write $pthm" }

            $zip = [System.IO.Compression.ZipFile]::OpenRead($pthm)
            try {
              $names = $zip.Entries | ForEach-Object { $_.FullName -replace '\\', '/' }
              $entry = $zip.Entries | Where-Object { $_.FullName -eq 'theme.yaml' }
              if (-not $entry) { throw "$config package has no theme.yaml at its root" }
              $reader = New-Object System.IO.StreamReader($entry.Open())
              try { $manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
            } finally { $zip.Dispose() }

            if ($manifest -match '\{\{') { throw "$config manifest still has placeholders:`n$manifest" }
            if ($manifest -notmatch "(?m)^Version:\s*$([regex]::Escape($version))\s*$") { throw "$config manifest isn't stamped with $version`n$manifest" }
            if ($manifest -notmatch '(?m)^Id:\s*XboxSeries_Dashboard\s*$') { throw "$config manifest has the wrong Id`n$manifest" }
            foreach ($image in 'Images/source-steam-shadow.png', 'Images/source-xbox-shadow.png') {
              if ($names -notcontains $image) { throw "$config package is missing $image" }
            }
            Write-Host "$config OK: $pthm"
          }

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    concurrency:
      group: theme-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack the Release theme
        id: pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = (dotnet msbuild $env:THEME_PROJECT -getProperty:Version).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected Bundle version '$version'" }
          dotnet build $env:THEME_PROJECT -c Release
          $pthm = (dotnet msbuild $env:THEME_PROJECT -p:Configuration=Release -getProperty:ThemePackagePath).Trim()
          if (-not (Test-Path $pthm)) { throw "Release pack did not write $pthm" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=theme-v$version" >> $env:GITHUB_OUTPUT
          "pthm=$pthm" >> $env:GITHUB_OUTPUT

      - name: Refuse if the release already exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pack.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Only gh's "release not found" means there's none: any other failure (auth, rate limit, network) stops here.
          $release = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY 2>&1
          if ($LASTEXITCODE -eq 0) { throw "Release $env:TAG already exists; bump Version in Directory.Build.props" }
          if ("$release" -notmatch 'release not found') { throw "Couldn't check for release $($env:TAG): $release" }
          $remoteTag = git ls-remote --tags origin "refs/tags/$env:TAG"
          if ($LASTEXITCODE -ne 0) { throw "git ls-remote failed" }
          if ($remoteTag) { throw "Tag $env:TAG already exists; bump Version in Directory.Build.props" }
          $global:LASTEXITCODE = 0

      # Refuses the file if any VirusTotal engine finds it malicious or suspicious; its report goes in the notes.
      - name: Scan on VirusTotal
        id: vt
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: ./build/VirusTotal.ps1 "${{ steps.pack.outputs.pthm }}"

      - name: Create the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pack.outputs.tag }}
          VERSION: ${{ steps.pack.outputs.version }}
          PTHM: ${{ steps.pack.outputs.pthm }}
        # Early access: released as a pre-release, under "(early access)", until the Bundle's first stable release.
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          gh release create $env:TAG $env:PTHM `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Xbox Series Dashboard theme $env:VERSION (early access)" `
            --prerelease `
            --notes "The Dashboard theme of Bundle $env:VERSION, built from $env:GITHUB_SHA. Install the .pthm in Playnite. VirusTotal: ${{ steps.vt.outputs.report }}"
