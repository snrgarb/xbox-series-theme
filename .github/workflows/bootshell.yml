# The Boot shell's pipeline (#128). Check: builds and runs the Boot shell's tests on a PR or a push to main that touches
# the Boot shell, the shared file it links or the props it imports. Deploy: a manual run only, which publishes the
# Release NativeAOT exe and creates the GitHub Release bootshell-v<version>, the version read from the Boot shell's own
# project; it refuses when that release already exists and never overwrites one, and when VirusTotal flags the exe
# (build/VirusTotal.ps1).
name: Boot shell

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "bootshell/**"
      - "shared/BootShellEvents.cs"
      - "Directory.Build.props"
      - ".github/workflows/bootshell.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PROJECT: bootshell/XboxSeries.BootShell/XboxSeries.BootShell.csproj
  TESTS: bootshell/XboxSeries.BootShell.Tests/XboxSeries.BootShell.Tests.csproj

jobs:
  # Every PR runs this workflow, so its check can be required on main (docs/development.md): this job reads the PR's
  # files, and the check below runs only when one is under the paths that push lists. Skipped, the check reports
  # success. Any other event, or a PR whose files can't be listed, runs the check.
  changes:
    name: 'Boot shell: changes'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.paths.outputs.run }}
    steps:
      - name: Did the PR touch this component?
        id: paths
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          PATHS: '^(bootshell/|shared/BootShellEvents\.cs$|Directory\.Build\.props$|\.github/workflows/bootshell\.yml$)'
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then echo run=true >> "$GITHUB_OUTPUT"; exit 0; fi
          if ! files="$(gh pr diff "$PR" --name-only --repo "$GITHUB_REPOSITORY")"; then
            echo "Couldn't list the PR's files: running the check"; echo run=true >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -qE "$PATHS" <<< "$files"; then echo run=true; else echo run=false; fi | tee -a "$GITHUB_OUTPUT"

  check:
    name: 'Boot shell: build and test'
    needs: changes
    if: github.event_name != 'workflow_dispatch' && needs.changes.outputs.run == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        shell: pwsh
        run: dotnet test $env:TESTS -c Release

  deploy:
    name: Publish and release
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (dotnet msbuild $env:PROJECT -getProperty:Version -p:Configuration=Release).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') { throw "Could not read the Boot shell's version: '$version'" }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=bootshell-v$version" >> $env:GITHUB_OUTPUT
          "Boot shell $version, tag bootshell-v$version"

      - name: Refuse an existing release
        shell: pwsh
        run: |
          # Only gh's "release not found" means there's none: any other failure (auth, rate limit, network) stops here.
          $release = gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" 2>&1
          if ($LASTEXITCODE -eq 0) { throw "Release ${{ steps.version.outputs.tag }} already exists; bump the Boot shell's Version to release again" }
          if ("$release" -notmatch 'release not found') { throw "Couldn't check for release ${{ steps.version.outputs.tag }}: $release" }
          $remoteTag = git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}"
          if ($LASTEXITCODE -ne 0) { throw "git ls-remote failed" }
          if ($remoteTag) { throw "Tag ${{ steps.version.outputs.tag }} already exists" }
          $global:LASTEXITCODE = 0

      - name: Test
        shell: pwsh
        run: dotnet test $env:TESTS -c Release

      - name: Publish
        shell: pwsh
        run: |
          # NativeAOT links with the C++ build tools; their vcvarsall.bat finds vswhere.exe by name on PATH.
          $env:PATH += ";${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          dotnet publish $env:PROJECT -c Release -r win-x64
          if ($LASTEXITCODE -ne 0) { throw "Publish failed" }
          $exe = "bootshell/XboxSeries.BootShell/bin/Release/net10.0-windows/win-x64/publish/XboxSeries.BootShell.exe"
          if (-not (Test-Path $exe)) { throw "No exe at $exe" }

      # Refuses the file if any VirusTotal engine finds it malicious or suspicious; its report goes in the notes.
      - name: Scan on VirusTotal
        id: vt
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: ./build/VirusTotal.ps1 "bootshell/XboxSeries.BootShell/bin/Release/net10.0-windows/win-x64/publish/XboxSeries.BootShell.exe"

      - name: Create release
        shell: pwsh
        # Early access: released as a pre-release, under "(early access)", until the Bundle's first stable release.
        run: |
          gh release create "${{ steps.version.outputs.tag }}" `
            "bootshell/XboxSeries.BootShell/bin/Release/net10.0-windows/win-x64/publish/XboxSeries.BootShell.exe" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "Boot shell ${{ steps.version.outputs.version }} (early access)" `
            --prerelease `
            --notes "The Boot shell ${{ steps.version.outputs.version }}, one NativeAOT exe built from ${{ github.sha }}. See bootshell/XboxSeries.BootShell/README.md to set it up. VirusTotal: ${{ steps.vt.outputs.report }}"
